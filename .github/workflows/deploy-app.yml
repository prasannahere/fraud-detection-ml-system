name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "app/api/**"
      - "app/stream/**"
      - "shared/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: fraud-detection-500117
  GCP_REGION: us-central1
  AR_REPOSITORY: fraud-detection-repo
  AR_HOST: us-central1-docker.pkg.dev
  GCS_ARTIFACTS_BUCKET: fraud-detection-500117-artifacts

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      stream: ${{ steps.filter.outputs.stream }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'app/api/**'
              - 'shared/**'
            stream:
              - 'app/stream/**'
            frontend:
              - 'app/frontend/**'
            workflow:
              - '.github/workflows/deploy-app.yml'

  deploy-api:
    name: Deploy api
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Build and push api
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/api:${{ github.sha }}
        run: |
          docker build \
            -f app/api/Dockerfile \
            --build-arg MODEL_VERSION=v1 \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"

      - name: Deploy api to Cloud Run
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/api:${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRAUD_AUTH_USERS: ${{ secrets.FRAUD_AUTH_USERS }}
        run: |
          gcloud run deploy api \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --execution-environment gen2 \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 900 \
            --allow-unauthenticated \
            --add-volume name=gcs-artifacts,type=cloud-storage,bucket=${{ env.GCS_ARTIFACTS_BUCKET }} \
            --add-volume-mount volume=gcs-artifacts,mount-path=/mnt/gcs \
            --set-env-vars "MODEL_VERSION=v1,ENABLE_AUDIT=false,GCP_PROJECT=${{ env.GCP_PROJECT_ID }},BIGQUERY_DATASET=fraud_ml,BIGQUERY_TABLE=prediction_audit,JWT_EXPIRE_MINUTES=60,JWT_SECRET=${JWT_SECRET},FRAUD_AUTH_USERS=${FRAUD_AUTH_USERS},MODEL_PATH=/mnt/gcs/models/xgb95/xgb95_final.ubj,ENCODERS_PATH=/mnt/gcs/models/xgb95/encoders.pkl,TRAINING_STATS_PATH=/mnt/gcs/models/xgb95/training_stats.pkl,METADATA_PATH=/mnt/gcs/models/xgb95/metadata.json,THRESHOLD_PATH=/mnt/gcs/models/xgb95/threshold.json,FEATURES_PATH=/mnt/gcs/models/xgb95/xgb95_final_features.pkl" \
            --quiet

  deploy-stream:
    name: Deploy stream
    needs: [changes, deploy-api]
    if: |
      always() &&
      !cancelled() &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.stream == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Build and push stream
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/stream:${{ github.sha }}
        run: |
          docker build -f app/stream/Dockerfile -t "$IMAGE" app/stream
          docker push "$IMAGE"

      - name: Deploy stream to Cloud Run
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/stream:${{ github.sha }}
          FRAUD_AUTH_PASSWORD: ${{ secrets.FRAUD_AUTH_PASSWORD }}
          FRAUD_AUTH_USERNAME: ${{ secrets.FRAUD_AUTH_USERNAME }}
        run: |
          API_URL=$(gcloud run services describe api \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')

          if [ -z "$API_URL" ]; then
            echo "api service has no URL — deploy api first and ensure it is Ready"
            exit 1
          fi

          gcloud run deploy stream \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --execution-environment gen2 \
            --port 8000 \
            --timeout 3600 \
            --allow-unauthenticated \
            --add-volume name=gcs-artifacts,type=cloud-storage,bucket=${{ env.GCS_ARTIFACTS_BUCKET }} \
            --add-volume-mount volume=gcs-artifacts,mount-path=/mnt/gcs \
            --set-env-vars "DATA_FILE_PATH=/mnt/gcs/data/sample_transactions.csv,STREAM_INTERVAL_SECONDS=1,API_URL=${API_URL},FRAUD_AUTH_USERNAME=${FRAUD_AUTH_USERNAME:-admin},FRAUD_AUTH_PASSWORD=${FRAUD_AUTH_PASSWORD},FRAUD_THRESHOLD=0.8" \
            --quiet

  deploy-frontend:
    name: Deploy frontend
    needs: [changes, deploy-api, deploy-stream]
    if: |
      always() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      ) &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-stream.result == 'success' || needs.deploy-stream.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Resolve backend service URLs
        id: urls
        run: |
          echo "api_url=$(gcloud run services describe api \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

          echo "stream_url=$(gcloud run services describe stream \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/frontend:${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ steps.urls.outputs.api_url }}" \
            --build-arg VITE_STREAM_API_URL="${{ steps.urls.outputs.stream_url }}" \
            -t "$IMAGE" \
            app/frontend
          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/frontend:${{ github.sha }}
        run: |
          gcloud run deploy frontend \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --port 80 \
            --allow-unauthenticated \
            --quiet
