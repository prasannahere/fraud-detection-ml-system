name: Deploy to Cloud Run

# Triggers: push to main, or manual run from Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: fraud-detection-500117
  GCP_REGION: us-central1
  AR_REPOSITORY: fraud-detection-repo
  AR_HOST: us-central1-docker.pkg.dev
  GCS_ARTIFACTS_BUCKET: fraud-detection-500117-artifacts

jobs:
  deploy-backends:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fraud-api
            context: fraud-api
            port: 8000
          - service: stream-service
            context: stream-service
            port: 8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
        run: |
          if [ "${{ matrix.service }}" = "fraud-api" ]; then
            docker build \
              --build-arg MODEL_VERSION=v1 \
              -t "$IMAGE" \
              ${{ matrix.context }}
          else
            docker build -t "$IMAGE" ${{ matrix.context }}
          fi

          docker push "$IMAGE"

      - name: Deploy fraud-api to Cloud Run
        if: matrix.service == 'fraud-api'
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/fraud-api:${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRAUD_AUTH_USERS: ${{ secrets.FRAUD_AUTH_USERS }}
        run: |
          gcloud run deploy fraud-api \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --execution-environment gen2 \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 900 \
            --allow-unauthenticated \
            --add-volume name=gcs-artifacts,type=cloud-storage,bucket=${{ env.GCS_ARTIFACTS_BUCKET }} \
            --add-volume-mount volume=gcs-artifacts,mount-path=/mnt/gcs \
            --set-env-vars "MODEL_VERSION=v1,ENABLE_AUDIT=false,GCP_PROJECT=${{ env.GCP_PROJECT_ID }},BIGQUERY_DATASET=fraud_ml,BIGQUERY_TABLE=prediction_audit,JWT_EXPIRE_MINUTES=60,JWT_SECRET=${JWT_SECRET},FRAUD_AUTH_USERS=${FRAUD_AUTH_USERS},MODEL_PATH=/mnt/gcs/models/xgb95/xgb95_final.ubj,ENCODERS_PATH=/mnt/gcs/models/xgb95/encoders.pkl,TRAINING_STATS_PATH=/mnt/gcs/models/xgb95/training_stats.pkl,METADATA_PATH=/mnt/gcs/models/xgb95/metadata.json,THRESHOLD_PATH=/mnt/gcs/models/xgb95/threshold.json,FEATURES_PATH=/mnt/gcs/models/xgb95/xgb95_final_features.pkl" \
            --quiet

      - name: Deploy stream-service to Cloud Run
        if: matrix.service == 'stream-service'
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/stream-service:${{ github.sha }}
          FRAUD_AUTH_PASSWORD: ${{ secrets.FRAUD_AUTH_PASSWORD }}
          FRAUD_AUTH_USERNAME: ${{ secrets.FRAUD_AUTH_USERNAME }}
        run: |
          FRAUD_API_URL=$(gcloud run services describe fraud-api \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')

          gcloud run deploy stream-service \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --execution-environment gen2 \
            --port 8000 \
            --timeout 3600 \
            --allow-unauthenticated \
            --add-volume name=gcs-artifacts,type=cloud-storage,bucket=${{ env.GCS_ARTIFACTS_BUCKET }} \
            --add-volume-mount volume=gcs-artifacts,mount-path=/mnt/gcs \
            --set-env-vars "DATA_FILE_PATH=/mnt/gcs/data/sample_transactions.csv,STREAM_INTERVAL_SECONDS=1,FRAUD_API_URL=${FRAUD_API_URL},FRAUD_AUTH_USERNAME=${FRAUD_AUTH_USERNAME:-admin},FRAUD_AUTH_PASSWORD=${FRAUD_AUTH_PASSWORD},FRAUD_THRESHOLD=0.8" \
            --quiet

  deploy-frontend:
    name: Deploy frontend
    needs: deploy-backends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Resolve backend service URLs
        id: urls
        run: |
          echo "fraud_api_url=$(gcloud run services describe fraud-api \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

          echo "stream_api_url=$(gcloud run services describe stream-service \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/frontend:${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_FRAUD_API_URL="${{ steps.urls.outputs.fraud_api_url }}" \
            --build-arg VITE_STREAM_API_URL="${{ steps.urls.outputs.stream_api_url }}" \
            -t "$IMAGE" \
            frontend

          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/frontend:${{ github.sha }}
        run: |
          gcloud run deploy frontend \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --port 80 \
            --allow-unauthenticated \
            --quiet