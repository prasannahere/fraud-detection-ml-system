name: Fraud API CI/CD

on:
  push:
    branches: [main]
    paths:
      - "fraud-api/**"
      - ".github/workflows/fraud-api.yml"
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  SERVICE_NAME: fraud-api
  AR_REPO: fraud-ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r fraud-api/requirements.txt

      - name: Import smoke test
        working-directory: fraud-api
        run: python -c "from src.schemas import TransactionInput; from src.config import load_thresholds; load_thresholds()"

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push versioned image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/fraud-api
        run: |
          docker build \
            --build-arg MODEL_VERSION=v1 \
            -t ${IMAGE_TAG}:v1 \
            -t ${IMAGE_TAG}:latest \
            fraud-api
          docker push ${IMAGE_TAG}:v1
          docker push ${IMAGE_TAG}:latest

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/fraud-api:latest
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${IMAGE_TAG} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars MODEL_VERSION=v1 \
            --quiet
