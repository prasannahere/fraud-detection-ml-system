name: Train Model

on:
  workflow_dispatch:
    inputs:
      output_prefix:
        description: GCS prefix for model artifacts
        required: false
        default: models/xgb95
  push:
    branches: [main]
    paths:
      - "training/**"
      - "shared/**"
      - ".github/workflows/train-model.yml"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fraud-detection-500117
  GCP_REGION: us-central1
  GCS_ARTIFACTS_BUCKET: fraud-detection-500117-artifacts
  OUTPUT_PREFIX: ${{ github.event.inputs.output_prefix || 'models/xgb95' }}

jobs:
  train:
    name: Train and upload artifacts to GCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build training image
        run: docker build -f training/Dockerfile -t fraud-training:ci .

      - name: Run training container
        run: |
          mkdir -p outputs/model
          docker run --rm \
            -v "$PWD/data:/data:ro" \
            -v "$PWD/outputs:/outputs" \
            fraud-training:ci \
            --train-transaction /data/sample_train_transaction.csv \
            --train-identity /data/sample_train_identity.csv \
            --test-transaction /data/sample_test_transaction.csv \
            --test-identity /data/sample_test_identity.csv \
            --output-dir /outputs/model

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload artifacts to GCS
        run: |
          gsutil -m cp -r outputs/model/* "gs://${GCS_ARTIFACTS_BUCKET}/${OUTPUT_PREFIX}/"
